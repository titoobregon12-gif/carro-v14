name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev libtinfo5
          pip install --upgrade pip
          pip install buildozer cython
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
      - name: Build with Buildozer
        run: |
          yes | buildozer android debug || (yes | ~/.[STRIPPED 74 bytes] --licenses || true && buildozer android debug)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carro-v14-apk
          path: bin/*.apk
